[program:opencode]
command=/usr/local/bin/start-opencode {OC_ARGS}
directory={OC_DIR}
user={USER_NAME}
environment=HOME="{USER_HOME}",USER="{USER_NAME}",OPENCODE_MODE="{OC_MODE}",OPENCODE_PORT="{OC_PORT}"{OC_ENV_EXTRA}
autostart=true
autorestart=true
stdout_logfile=/tmp/opencode.log
stderr_logfile=/tmp/opencode.err.log
stopasgroup=true
killasgroup=true
stopwaitsecs=30
