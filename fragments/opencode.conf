[program:opencode]
command=/usr/local/bin/opencode {OC_MODE} --port {OC_PORT} --hostname 0.0.0.0 {OC_ARGS}
directory={OC_DIR}
user={USER_NAME}
environment=HOME="{USER_HOME}",USER="{USER_NAME}"{OC_ENV_EXTRA}
autostart=true
autorestart=true
stdout_logfile=/tmp/opencode.log
stderr_logfile=/tmp/opencode.err.log
